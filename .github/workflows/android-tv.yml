name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '服务端 Base URL，不需要带 /tv，例如 https://example.com 或 http://192.168.1.10:3000'
        required: true
        default: 'http://192.168.1.10:3000'
        type: string
      app_name:
        description: 'Android TV 应用名称'
        required: true
        default: 'MoonTVPlus TV'
        type: string
      version_name:
        description: '版本名'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: '版本号，必须是整数'
        required: false
        default: '1'
        type: string
      variants:
        description: '选择要构建的版本（安卓 5.1.1 电视请选 *-android5plus）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - webview-android5plus
          - geckoview-android5plus
          - webview-android6plus
          - geckoview-android6plus
      geckoview_version:
        description: 'GeckoView 内核版本（仅 gecko 变体生效），如 115.0.20240715220401 / 126.0.20240526221752'
        required: false
        default: '126.0.20240526221752'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          declare -A FLAVOR=(
            [webview-android6plus]=webview
            [webview-android5plus]=webview
            [geckoview-android6plus]=gecko
            [geckoview-android5plus]=gecko
          )
          declare -A FLAVOR_TASK=(
            [webview]=Webview
            [gecko]=Gecko
          )
          declare -A MINSDK=(
            [webview-android6plus]=23
            [webview-android5plus]=21
            [geckoview-android6plus]=23
            [geckoview-android5plus]=21
          )
          if [ "$VARIANTS" = "all" ]; then
            labels=(webview-android6plus webview-android5plus geckoview-android6plus geckoview-android5plus)
          else
            labels=("$VARIANTS")
          fi
          json="["
          for l in "${labels[@]}"; do
            f="${FLAVOR[$l]}"
            json+="{\"label\":\"$l\",\"flavor\":\"$f\",\"flavor_task\":\"${FLAVOR_TASK[$f]}\",\"min_sdk\":\"${MINSDK[$l]}\"},"
          done
          json="${json%,}]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $json"

  build:
    name: Build Android TV APK (${{ matrix.label }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装已下架的 'tools' 包，导致 sdkmanager 报 "Failed to find package 'tools'"
          # 这里只装 platform-tools，去掉过时的 tools
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android TV icon from public/logo.png
        run: |
          cp public/logo.png apps/android-tv/app/src/main/res/drawable/logo.png

      - name: Decode Android signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/android-tv-release.keystore
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Release" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=release" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "Android signing secrets are not fully set, building debug APK only."
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Debug" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/android-tv
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          MIN_SDK: ${{ matrix.min_sdk }}
          GECKOVIEW_VERSION: ${{ inputs.geckoview_version }}
          ANDROID_KEYSTORE_PATH: /tmp/android-tv-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assemble${{ matrix.flavor_task }}${{ steps.signing.outputs.build_type_task }} \
            -PBASE_URL="$BASE_URL" \
            -PAPP_NAME="$APP_NAME" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PMIN_SDK="$MIN_SDK"

      - name: Collect APK artifacts
        run: |
          mkdir -p /tmp/android-tv-apks
          cp \
            "apps/android-tv/app/build/outputs/apk/${{ matrix.flavor }}/${{ steps.signing.outputs.build_type }}/app-${{ matrix.flavor }}-${{ steps.signing.outputs.apk_suffix }}.apk" \
            "/tmp/android-tv-apks/moontvplus-tv-${{ inputs.version_name }}-${{ matrix.label }}-${{ steps.signing.outputs.artifact_suffix }}.apk"
          ls -lh /tmp/android-tv-apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moontvplus-android-tv-${{ inputs.version_name }}-${{ matrix.label }}
          path: /tmp/android-tv-apks/*.apk
          if-no-files-found: error
          retention-days: 30
